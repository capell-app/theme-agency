<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Forced password change form</title>
  <desc id="desc">A Capell administrator is required to change password before continuing into the admin panel.</desc>
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .sidebar { fill: #182235; }
      .card { fill: #fff; stroke: #d9e0ea; stroke-width: 1; }
      .soft { fill: #eef7f6; stroke: #b7ded8; stroke-width: 1; }
      .danger { fill: #fff4ed; stroke: #fed7aa; stroke-width: 1; }
      .title { fill: #0f172a; font-family: Inter, Arial, sans-serif; font-size: 44px; font-weight: 800; }
      .label { fill: #111827; font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .small { fill: #64748b; font-family: Inter, Arial, sans-serif; font-size: 20px; }
      .tiny { fill: #64748b; font-family: Inter, Arial, sans-serif; font-size: 17px; }
      .white { fill: #f8fafc; font-family: Inter, Arial, sans-serif; }
      .nav { fill: #a7b4c7; font-family: Inter, Arial, sans-serif; font-size: 22px; }
      .field { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .accent { fill: #226f68; }
      .line { stroke: #e2e8f0; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="sidebar" width="270" height="900"/>
  <text x="42" y="72" class="white" font-size="30" font-weight="800">Capell Admin</text>
  <text x="56" y="185" class="nav">Dashboard</text>
  <text x="56" y="251" class="nav">Users</text>
  <text x="56" y="313" class="nav">Content</text>
  <text x="56" y="375" class="nav">Extensions</text>
  <rect x="28" y="430" width="214" height="54" rx="8" fill="#25314a"/>
  <text x="56" y="465" class="white" font-size="22" font-weight="700">Password reset</text>

  <text x="330" y="90" class="title">Change your password</text>
  <text x="332" y="130" class="small">Your account is flagged for a required password change before you continue.</text>

  <rect x="330" y="174" width="1030" height="102" rx="8" class="danger"/>
  <text x="366" y="224" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Password update required</text>
  <text x="366" y="253" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="19">This policy is enforced by your Capell administrator for panel access.</text>

  <rect x="330" y="314" width="640" height="480" rx="8" class="card"/>
  <text x="372" y="369" class="label">Choose a new password</text>
  <text x="372" y="412" class="small">Current password</text>
  <rect x="372" y="432" width="520" height="58" rx="8" class="field"/>
  <text x="400" y="469" class="tiny">••••••••••••</text>
  <text x="372" y="534" class="small">New password</text>
  <rect x="372" y="554" width="520" height="58" rx="8" class="field"/>
  <text x="400" y="591" class="tiny">••••••••••••••••</text>
  <text x="372" y="656" class="small">Confirm new password</text>
  <rect x="372" y="676" width="520" height="58" rx="8" class="field"/>
  <text x="400" y="713" class="tiny">••••••••••••••••</text>
  <rect x="372" y="754" width="250" height="58" rx="8" class="accent"/>
  <text x="417" y="791" class="white" font-size="22" font-weight="800">Update password</text>

  <rect x="1000" y="314" width="360" height="480" rx="8" class="card"/>
  <text x="1036" y="369" class="label">Active rules</text>
  <line x1="1036" y1="394" x2="1324" y2="394" class="line"/>
  <circle cx="1054" cy="440" r="10" class="accent"/>
  <text x="1080" y="447" class="small">At least 12 characters</text>
  <circle cx="1054" cy="496" r="10" class="accent"/>
  <text x="1080" y="503" class="small">Mixed case required</text>
  <circle cx="1054" cy="552" r="10" class="accent"/>
  <text x="1080" y="559" class="small">Number required</text>
  <circle cx="1054" cy="608" r="10" class="accent"/>
  <text x="1080" y="615" class="small">Symbol required</text>
  <circle cx="1054" cy="664" r="10" class="accent"/>
  <text x="1080" y="671" class="small">No recent reuse</text>
  <rect x="1036" y="714" width="288" height="48" rx="24" class="soft"/>
  <text x="1070" y="746" fill="#17655f" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">HIBP check enabled</text>
</svg>
