<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">User table password policy columns and filters</title>
  <desc id="desc">Capell users table with password status columns, policy filters, and require-change actions.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .sidebar { fill: #172033; }
      .panel { fill: #fff; stroke: #d9e0ea; stroke-width: 1; }
      .header { fill: #f1f5f9; }
      .title { fill: #0f172a; font-family: Inter, Arial, sans-serif; font-size: 46px; font-weight: 800; }
      .label { fill: #111827; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .small { fill: #64748b; font-family: Inter, Arial, sans-serif; font-size: 19px; }
      .tiny { fill: #64748b; font-family: Inter, Arial, sans-serif; font-size: 17px; }
      .white { fill: #f8fafc; font-family: Inter, Arial, sans-serif; }
      .nav { fill: #a7b4c7; font-family: Inter, Arial, sans-serif; font-size: 22px; }
      .activeNav { fill: #fff; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .accent { fill: #226f68; }
      .line { stroke: #e2e8f0; stroke-width: 2; }
      .chipOk { fill: #e7f6f3; stroke: #a7d8ce; stroke-width: 1; }
      .chipWarn { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1; }
      .chipTextOk { fill: #17655f; font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 800; }
      .chipTextWarn { fill: #a34d0a; font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 800; }
      .button { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="sidebar" width="270" height="900"/>
  <text x="42" y="72" class="white" font-size="30" font-weight="800">Capell Admin</text>
  <text x="56" y="185" class="nav">Dashboard</text>
  <rect x="28" y="216" width="214" height="54" rx="8" fill="#25314a"/>
  <text x="56" y="251" class="activeNav">Users</text>
  <text x="56" y="313" class="nav">Content</text>
  <text x="56" y="375" class="nav">Extensions</text>
  <text x="56" y="437" class="nav">Settings</text>

  <text x="330" y="88" class="title">Users</text>
  <text x="332" y="128" class="small">Review password status, filter by policy state, and require password changes.</text>
  <rect x="1128" y="54" width="174" height="56" rx="8" class="accent"/>
  <text x="1173" y="90" class="white" font-size="22" font-weight="800">New user</text>

  <rect x="330" y="168" width="1030" height="96" rx="8" class="panel"/>
  <rect x="366" y="196" width="220" height="42" rx="21" class="chipWarn"/>
  <text x="398" y="224" class="chipTextWarn">Expired passwords</text>
  <rect x="608" y="196" width="214" height="42" rx="21" class="chipOk"/>
  <text x="640" y="224" class="chipTextOk">Must change</text>
  <rect x="844" y="196" width="258" height="42" rx="21" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="878" y="224" fill="#4338ca" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Changed more than 90 days ago</text>

  <rect x="330" y="294" width="1030" height="500" rx="8" class="panel"/>
  <rect x="330" y="294" width="1030" height="66" rx="8" class="header"/>
  <text x="366" y="336" class="label">Name</text>
  <text x="600" y="336" class="label">Password status</text>
  <text x="840" y="336" class="label">Last changed</text>
  <text x="1058" y="336" class="label">Action</text>
  <line x1="330" y1="360" x2="1360" y2="360" class="line"/>

  <text x="366" y="415" class="label">Avery Morgan</text>
  <text x="366" y="444" class="tiny">avery@example.test</text>
  <rect x="600" y="393" width="132" height="36" rx="18" class="chipOk"/>
  <text x="626" y="417" class="chipTextOk">Compliant</text>
  <text x="840" y="417" class="small">4 days ago</text>
  <rect x="1058" y="386" width="210" height="46" rx="8" class="button"/>
  <text x="1094" y="416" class="label" font-size="18">Require change</text>
  <line x1="330" y1="474" x2="1360" y2="474" class="line"/>

  <text x="366" y="529" class="label">Morgan Lee</text>
  <text x="366" y="558" class="tiny">morgan@example.test</text>
  <rect x="600" y="507" width="148" height="36" rx="18" class="chipWarn"/>
  <text x="626" y="531" class="chipTextWarn">Must change</text>
  <text x="840" y="531" class="small">72 days ago</text>
  <rect x="1058" y="500" width="210" height="46" rx="8" fill="#e7f6f3" stroke="#a7d8ce"/>
  <text x="1094" y="530" fill="#17655f" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Already flagged</text>
  <line x1="330" y1="588" x2="1360" y2="588" class="line"/>

  <text x="366" y="643" class="label">Sam Rivera</text>
  <text x="366" y="672" class="tiny">sam@example.test</text>
  <rect x="600" y="621" width="120" height="36" rx="18" class="chipWarn"/>
  <text x="626" y="645" class="chipTextWarn">Expired</text>
  <text x="840" y="645" class="small">128 days ago</text>
  <rect x="1058" y="614" width="210" height="46" rx="8" class="button"/>
  <text x="1094" y="644" class="label" font-size="18">Require change</text>
  <line x1="330" y1="702" x2="1360" y2="702" class="line"/>

  <text x="366" y="757" class="label">Taylor Chen</text>
  <text x="366" y="786" class="tiny">taylor@example.test</text>
  <rect x="600" y="735" width="154" height="36" rx="18" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="626" y="759" fill="#4338ca" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">No timestamp</text>
  <text x="840" y="759" class="small">Unknown</text>
  <rect x="1058" y="728" width="210" height="46" rx="8" class="button"/>
  <text x="1094" y="758" class="label" font-size="18">Require change</text>
</svg>
