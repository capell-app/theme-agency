<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Password Policy settings page</title>
  <desc id="desc">Capell admin settings for password expiry, forced resets, complexity, password history, and compromised-password checks.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .sidebar { fill: #172033; }
      .panel { fill: #fff; stroke: #d9e0ea; stroke-width: 1; }
      .muted { fill: #64748b; font-family: Inter, Arial, sans-serif; font-size: 24px; }
      .label { fill: #111827; font-family: Inter, Arial, sans-serif; font-size: 25px; font-weight: 700; }
      .title { fill: #0f172a; font-family: Inter, Arial, sans-serif; font-size: 46px; font-weight: 800; }
      .small { fill: #64748b; font-family: Inter, Arial, sans-serif; font-size: 19px; }
      .white { fill: #f8fafc; font-family: Inter, Arial, sans-serif; }
      .nav { fill: #a7b4c7; font-family: Inter, Arial, sans-serif; font-size: 22px; }
      .activeNav { fill: #fff; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .accent { fill: #226f68; }
      .accentStroke { stroke: #226f68; stroke-width: 3; fill: none; }
      .line { stroke: #e2e8f0; stroke-width: 2; }
      .field { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .chip { fill: #e7f6f3; stroke: #a7d8ce; stroke-width: 1; }
      .chipText { fill: #17655f; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="sidebar" width="270" height="900"/>
  <text x="42" y="72" class="white" font-size="30" font-weight="800">Capell Admin</text>
  <rect x="28" y="150" width="214" height="54" rx="8" fill="#25314a"/>
  <text x="56" y="185" class="activeNav">Extensions</text>
  <text x="56" y="251" class="nav">Users</text>
  <text x="56" y="313" class="nav">Content</text>
  <text x="56" y="375" class="nav">Reports</text>
  <text x="56" y="437" class="nav">Settings</text>

  <text x="330" y="88" class="title">Password Policy</text>
  <text x="332" y="128" class="muted">Configure admin password age, reset enforcement, reuse history, and breach checks.</text>
  <rect x="1088" y="54" width="214" height="56" rx="8" class="accent"/>
  <text x="1130" y="90" class="white" font-size="22" font-weight="800">Save changes</text>

  <rect x="330" y="170" width="1030" height="160" rx="8" class="panel"/>
  <text x="366" y="222" class="label">Enforcement</text>
  <text x="366" y="259" class="small">Force password resets when users are flagged or their password age exceeds policy.</text>
  <line x1="366" y1="286" x2="1322" y2="286" class="line"/>
  <text x="366" y="315" class="small">Password expiry</text>
  <rect x="609" y="292" width="76" height="38" rx="19" class="accent"/>
  <circle cx="663" cy="311" r="15" fill="#fff"/>
  <text x="744" y="315" class="small">Expire after</text>
  <rect x="880" y="286" width="96" height="42" rx="8" class="field"/>
  <text x="912" y="315" class="label" font-size="21">90</text>
  <text x="992" y="315" class="small">days</text>
  <rect x="1124" y="286" width="160" height="42" rx="21" class="chip"/>
  <text x="1158" y="314" class="chipText">Enabled</text>

  <rect x="330" y="360" width="500" height="236" rx="8" class="panel"/>
  <text x="366" y="412" class="label">Complexity rules</text>
  <text x="366" y="447" class="small">Minimum length and required character groups.</text>
  <rect x="366" y="478" width="104" height="42" rx="8" class="field"/>
  <text x="405" y="507" class="label" font-size="21">12</text>
  <text x="492" y="507" class="small">Minimum characters</text>
  <rect x="366" y="540" width="182" height="38" rx="19" class="chip"/>
  <text x="395" y="566" class="chipText">Mixed case</text>
  <rect x="568" y="540" width="136" height="38" rx="19" class="chip"/>
  <text x="601" y="566" class="chipText">Numbers</text>
  <rect x="366" y="622" width="500" height="204" rx="8" class="panel"/>
  <text x="402" y="674" class="label">Compromised passwords</text>
  <text x="402" y="709" class="small">Reject breached passwords before they are saved.</text>
  <rect x="402" y="744" width="76" height="38" rx="19" class="accent"/>
  <circle cx="456" cy="763" r="15" fill="#fff"/>
  <text x="506" y="770" class="chipText">Range API check enabled</text>

  <rect x="860" y="360" width="500" height="236" rx="8" class="panel"/>
  <text x="896" y="412" class="label">Password history</text>
  <text x="896" y="447" class="small">Prevent administrators from reusing recent passwords.</text>
  <rect x="896" y="478" width="76" height="38" rx="19" class="accent"/>
  <circle cx="950" cy="497" r="15" fill="#fff"/>
  <text x="1004" y="503" class="small">Block last</text>
  <rect x="1122" y="474" width="96" height="42" rx="8" class="field"/>
  <text x="1162" y="503" class="label" font-size="21">5</text>
  <text x="1234" y="503" class="small">passwords</text>

  <rect x="896" y="540" width="412" height="38" rx="19" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="922" y="566" fill="#a34d0a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">History table installed and writable</text>

  <rect x="860" y="622" width="500" height="204" rx="8" class="panel"/>
  <text x="896" y="674" class="label">Operational posture</text>
  <text x="896" y="716" class="small">Users flagged for reset</text>
  <text x="1260" y="716" class="label">8</text>
  <line x1="896" y1="738" x2="1308" y2="738" class="line"/>
  <text x="896" y="777" class="small">Passwords expiring in 14 days</text>
  <text x="1250" y="777" class="label">21</text>
</svg>
