<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Social Feeds RSS sync pipeline</title>
  <desc id="desc">A pipeline diagram showing RSS fetch, normalized feed items, cached database records, and anonymous-safe public rendering.</desc>
  <rect width="1200" height="675" fill="#f7fafc"/>
  <text x="80" y="92" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Cached sync pipeline</text>
  <text x="80" y="132" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="22">External APIs never run inside public Blade rendering.</text>
  <g fill="#ffffff" stroke="#d7dee8" stroke-width="2">
    <rect x="90" y="250" width="210" height="150" rx="18"/>
    <rect x="370" y="250" width="210" height="150" rx="18"/>
    <rect x="650" y="250" width="210" height="150" rx="18"/>
    <rect x="930" y="250" width="210" height="150" rx="18"/>
  </g>
  <g fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">
    <text x="139" y="320">RSS / Atom</text>
    <text x="405" y="320">Normalize</text>
    <text x="690" y="320">Cache rows</text>
    <text x="962" y="320">Public block</text>
  </g>
  <g fill="#475569" font-family="Inter, Arial, sans-serif" font-size="17">
    <text x="130" y="356">Fetch with timeout</text>
    <text x="406" y="356">DTO post data</text>
    <text x="682" y="356">social_feed_items</text>
    <text x="967" y="356">No secrets or IDs</text>
  </g>
  <g stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M305 325h55"/>
    <path d="M585 325h55"/>
    <path d="M865 325h55"/>
  </g>
</svg>
