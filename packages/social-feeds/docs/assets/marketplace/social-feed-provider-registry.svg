<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Social Feeds provider registry</title>
  <desc id="desc">A provider registry diagram showing built-in and custom social feed providers registered into one Capell widget.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="80" y="88" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Provider registry</text>
  <text x="80" y="128" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="22">Built-ins plus tagged custom providers without package coupling.</text>
  <rect x="430" y="238" width="340" height="180" rx="22" fill="#0f172a"/>
  <text x="488" y="323" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">SocialFeedProviderRegistry</text>
  <text x="521" y="362" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18">register, resolve, fetch</text>
  <g font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="86" y="200" width="180" height="64" rx="16" fill="#dbeafe"/>
    <text x="140" y="239" fill="#1d4ed8">RSS</text>
    <rect x="86" y="304" width="180" height="64" rx="16" fill="#fee2e2"/>
    <text x="130" y="343" fill="#b91c1c">TikTok</text>
    <rect x="86" y="408" width="180" height="64" rx="16" fill="#fef3c7"/>
    <text x="124" y="447" fill="#b45309">YouTube</text>
    <rect x="934" y="200" width="180" height="64" rx="16" fill="#dcfce7"/>
    <text x="976" y="239" fill="#15803d">Bluesky</text>
    <rect x="934" y="304" width="180" height="64" rx="16" fill="#ede9fe"/>
    <text x="971" y="343" fill="#6d28d9">Instagram</text>
    <rect x="934" y="408" width="180" height="64" rx="16" fill="#e0f2fe"/>
    <text x="965" y="447" fill="#0369a1">Custom</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M266 232h154"/>
    <path d="M266 336h154"/>
    <path d="M266 440h154"/>
    <path d="M780 232h154"/>
    <path d="M780 336h154"/>
    <path d="M780 440h154"/>
  </g>
</svg>
