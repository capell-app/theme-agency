<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Inertia bookings homepage</title>
  <desc id="desc">Preview of a booking-led Inertia homepage.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="88" y="80" width="1024" height="600" rx="28" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="140" y="172" fill="#0f172a" font-family="Arial, sans-serif" font-size="56" font-weight="700">Book the right appointment faster</text>
  <text x="140" y="230" fill="#475569" font-family="Arial, sans-serif" font-size="26">Service proof, availability cues, and booking action stay in one flow.</text>
  <rect x="140" y="292" width="250" height="70" rx="12" fill="#f97316"/>
  <text x="176" y="336" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="700">Request appointment</text>
  <g transform="translate(140 430)" fill="#ecfeff" stroke="#99f6e4">
    <rect width="280" height="140" rx="18"/>
    <rect x="330" width="280" height="140" rx="18"/>
    <rect x="660" width="280" height="140" rx="18"/>
  </g>
  <g fill="#134e4a" font-family="Arial, sans-serif" font-size="24" font-weight="700">
    <text x="172" y="506">Services</text>
    <text x="502" y="506">Proof</text>
    <text x="832" y="506">Locations</text>
  </g>
</svg>
