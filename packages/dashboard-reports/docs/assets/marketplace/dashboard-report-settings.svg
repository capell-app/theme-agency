<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard Reports settings screen</title>
  <desc id="desc">Illustrated Capell dashboard settings page showing Dashboard Reports visibility toggles.</desc>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="96" y="70" width="1088" height="580" rx="28" fill="#ffffff" stroke="#dbe3ef" stroke-width="2"/>
  <rect x="96" y="70" width="282" height="580" rx="28" fill="#102033"/>
  <rect x="96" y="354" width="282" height="296" fill="#102033"/>
  <text x="146" y="136" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Settings</text>
  <rect x="130" y="184" width="214" height="42" rx="12" fill="#1e293b"/>
  <text x="154" y="211" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#cbd5e1">Dashboard</text>
  <rect x="130" y="242" width="214" height="42" rx="12" fill="#2563eb"/>
  <text x="154" y="269" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Reports</text>
  <text x="430" y="134" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#102033">Dashboard Reports</text>
  <text x="430" y="170" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Choose which reporting widgets appear on the main dashboard.</text>
  <rect x="430" y="230" width="690" height="118" rx="22" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="472" y="279" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#102033">Publishing Trend</text>
  <text x="472" y="310" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748b">Show published versus scheduled page activity.</text>
  <rect x="996" y="270" width="72" height="36" rx="18" fill="#2563eb"/>
  <circle cx="1050" cy="288" r="14" fill="#ffffff"/>
  <rect x="430" y="382" width="690" height="118" rx="22" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="472" y="431" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#102033">Content Health</text>
  <text x="472" y="462" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748b">Show scheduled, expired, stale, and URL-less page issues.</text>
  <rect x="996" y="422" width="72" height="36" rx="18" fill="#2563eb"/>
  <circle cx="1050" cy="440" r="14" fill="#ffffff"/>
  <rect x="430" y="534" width="240" height="50" rx="14" fill="#102033"/>
  <text x="472" y="566" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Save settings</text>
</svg>
