  <text x="664" y="429" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#101715">Escalation rules</text>
  <text x="664" y="454" font-family="Arial, sans-serif" font-size="16" fill="#52615b">Keywords, low confidence, and manual handoff</text>
