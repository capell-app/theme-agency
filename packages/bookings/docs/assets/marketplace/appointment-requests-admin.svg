  <text x="122" y="195" fill="#64748b" font-family="Arial, sans-serif" font-size="22">Queue, status, customer, service, and audit trail.</text>
  <rect x="122" y="246" width="956" height="64" rx="12" fill="#0f766e"/>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">
