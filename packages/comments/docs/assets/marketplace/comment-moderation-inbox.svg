<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Comments moderation inbox</title>
  <desc id="description">Marketplace preview of a Capell admin moderation inbox with pending, approved, rejected, and spam comment queues.</desc>
  <rect width="1440" height="900" fill="#f5f7fb"/>
  <rect x="72" y="64" width="1296" height="772" rx="18" fill="#ffffff" stroke="#d8dee9"/>
  <rect x="72" y="64" width="1296" height="84" rx="18" fill="#172033"/>
  <text x="116" y="116" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Comment moderation inbox</text>
  <rect x="112" y="186" width="286" height="104" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="136" y="232" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Pending review</text>
  <text x="136" y="266" fill="#7c2d12" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">18</text>
  <rect x="426" y="186" width="286" height="104" rx="14" fill="#ecfdf5" stroke="#bbf7d0"/>
  <text x="450" y="232" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Approved today</text>
  <text x="450" y="266" fill="#14532d" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">42</text>
  <rect x="740" y="186" width="286" height="104" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="764" y="232" fill="#991b1b" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Rejected</text>
  <text x="764" y="266" fill="#7f1d1d" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">7</text>
  <rect x="1054" y="186" width="274" height="104" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1078" y="232" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Spam held</text>
  <text x="1078" y="266" fill="#1e293b" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">31</text>
  <rect x="112" y="330" width="1216" height="436" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="112" y="330" width="1216" height="58" rx="14" fill="#f8fafc"/>
  <text x="146" y="366" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Author</text>
  <text x="408" y="366" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Comment</text>
  <text x="978" y="366" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Status</text>
  <text x="1166" y="366" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Action</text>
  <g font-family="Inter, Arial, sans-serif" font-size="20" fill="#0f172a">
    <text x="146" y="434">Priya Shah</text>
    <text x="408" y="434">"This answered exactly what we needed for the launch."</text>
    <text x="146" y="512">Marcus Lee</text>
    <text x="408" y="512">"Can we get a follow-up article on moderation policy?"</text>
    <text x="146" y="590">Avery Cole</text>
    <text x="408" y="590">"Several links here look suspicious and need review."</text>
    <text x="146" y="668">Nadia Owens</text>
    <text x="408" y="668">"Thanks for adding threaded replies to the guide."</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="968" y="410" width="116" height="32" rx="16" fill="#ffedd5"/>
    <text x="990" y="432" fill="#9a3412">Pending</text>
    <rect x="968" y="488" width="116" height="32" rx="16" fill="#dcfce7"/>
    <text x="990" y="510" fill="#166534">Approved</text>
    <rect x="968" y="566" width="116" height="32" rx="16" fill="#fee2e2"/>
    <text x="1002" y="588" fill="#991b1b">Spam</text>
    <rect x="968" y="644" width="116" height="32" rx="16" fill="#ffedd5"/>
    <text x="990" y="666" fill="#9a3412">Pending</text>
  </g>
  <g fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">
    <text x="1166" y="432">Review</text>
    <text x="1166" y="510">View</text>
    <text x="1166" y="588">Audit</text>
    <text x="1166" y="666">Review</text>
  </g>
</svg>
