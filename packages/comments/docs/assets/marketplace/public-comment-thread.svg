<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Public comment thread</title>
  <desc id="description">Marketplace preview of a cache-safe public comment thread with approved replies and aggregate like counts.</desc>
  <rect width="1440" height="900" fill="#f7faf8"/>
  <rect x="118" y="76" width="1204" height="748" rx="22" fill="#ffffff" stroke="#dce6df"/>
  <text x="168" y="146" fill="#10231b" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Discussion</text>
  <text x="168" y="190" fill="#5b6f64" font-family="Inter, Arial, sans-serif" font-size="22">Approved replies load after the page, keeping cached HTML clean.</text>
  <rect x="168" y="240" width="1104" height="126" rx="18" fill="#f8fafc" stroke="#dbe4ee"/>
  <text x="206" y="286" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Priya Shah</text>
  <text x="206" y="326" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="22">This guide made it clear how comments stay cache-safe while editors review replies.</text>
  <text x="1110" y="286" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="18">12 min ago</text>
  <text x="206" y="350" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Like · 8</text>
  <rect x="228" y="402" width="1044" height="112" rx="18" fill="#ffffff" stroke="#dbe4ee"/>
  <text x="266" y="446" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Nadia Owens</text>
  <text x="266" y="484" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="21">The reply notifications are useful without exposing email addresses publicly.</text>
  <text x="1110" y="446" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="18">8 min ago</text>
  <rect x="168" y="552" width="1104" height="126" rx="18" fill="#f8fafc" stroke="#dbe4ee"/>
  <text x="206" y="598" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Marcus Lee</text>
  <text x="206" y="638" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="22">Can this be enabled on Blog articles as well as normal pages?</text>
  <text x="1110" y="598" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="18">1 hour ago</text>
  <text x="206" y="662" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Like · 3</text>
  <rect x="168" y="718" width="356" height="54" rx="27" fill="#10231b"/>
  <text x="218" y="752" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Join the discussion</text>
</svg>
