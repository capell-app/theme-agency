<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Comments admin resource</title>
  <desc id="description">Marketplace preview of the comments admin table with nested replies, statuses, and moderation timestamps.</desc>
  <rect width="1440" height="900" fill="#f5f7fb"/>
  <rect x="74" y="68" width="1292" height="764" rx="18" fill="#ffffff" stroke="#d8dee9"/>
  <text x="120" y="132" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800">Comments</text>
  <text x="120" y="172" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="22">Audit every public reply, status transition, and moderation timestamp.</text>
  <rect x="120" y="218" width="118" height="42" rx="21" fill="#172033"/>
  <text x="150" y="246" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">All</text>
  <rect x="254" y="218" width="152" height="42" rx="21" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="282" y="246" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Pending</text>
  <rect x="422" y="218" width="156" height="42" rx="21" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="450" y="246" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Approved</text>
  <rect x="120" y="304" width="1200" height="430" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="120" y="304" width="1200" height="58" rx="14" fill="#f8fafc"/>
  <g fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">
    <text x="154" y="340">Thread</text>
    <text x="634" y="340">Author</text>
    <text x="850" y="340">Status</text>
    <text x="1052" y="340">Moderated</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" fill="#0f172a">
    <text x="154" y="416" font-size="21" font-weight="700">Launch checklist feedback</text>
    <text x="190" y="452" font-size="19" fill="#475569">Reply: "The accessibility section helped our team."</text>
    <text x="154" y="530" font-size="21" font-weight="700">Blog article discussion</text>
    <text x="190" y="566" font-size="19" fill="#475569">Reply: "Could you add moderation examples?"</text>
    <text x="154" y="644" font-size="21" font-weight="700">Product update announcement</text>
    <text x="190" y="680" font-size="19" fill="#475569">Reply: "Excited to try this on our site."</text>
    <text x="634" y="416" font-size="20">Priya Shah</text>
    <text x="634" y="530" font-size="20">Marcus Lee</text>
    <text x="634" y="644" font-size="20">Nadia Owens</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="840" y="392" width="128" height="34" rx="17" fill="#dcfce7"/>
    <text x="866" y="415" fill="#166534">Approved</text>
    <rect x="840" y="506" width="128" height="34" rx="17" fill="#fef3c7"/>
    <text x="870" y="529" fill="#92400e">Pending</text>
    <rect x="840" y="620" width="128" height="34" rx="17" fill="#dcfce7"/>
    <text x="866" y="643" fill="#166534">Approved</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="20" fill="#334155">
    <text x="1052" y="416">12 minutes ago</text>
    <text x="1052" y="530">Awaiting review</text>
    <text x="1052" y="644">Yesterday</text>
  </g>
</svg>
