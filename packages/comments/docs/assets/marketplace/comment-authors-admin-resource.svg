<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Comment authors admin resource</title>
  <desc id="description">Marketplace preview of the author management table for verified and moderated public commenters.</desc>
  <rect width="1440" height="900" fill="#f6f8fb"/>
  <rect x="82" y="70" width="1276" height="760" rx="18" fill="#ffffff" stroke="#dce3ec"/>
  <text x="124" y="134" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800">Comment authors</text>
  <text x="124" y="174" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="22">Encrypted identity records, verification state, and moderation controls.</text>
  <rect x="124" y="222" width="1192" height="76" rx="14" fill="#eef6ff" stroke="#bfdbfe"/>
  <text x="156" y="270" fill="#1e40af" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Verified authors can receive reply notifications while private hashes stay hidden.</text>
  <rect x="124" y="338" width="1192" height="390" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="124" y="338" width="1192" height="58" rx="14" fill="#f8fafc"/>
  <g fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">
    <text x="158" y="374">Display name</text>
    <text x="430" y="374">Verification</text>
    <text x="686" y="374">Moderation state</text>
    <text x="990" y="374">Last activity</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="21" fill="#0f172a">
    <text x="158" y="450">Priya Shah</text>
    <text x="158" y="526">Marcus Lee</text>
    <text x="158" y="602">Avery Cole</text>
    <text x="158" y="678">Nadia Owens</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="420" y="426" width="128" height="34" rx="17" fill="#dcfce7"/>
    <text x="448" y="449" fill="#166534">Verified</text>
    <rect x="420" y="502" width="128" height="34" rx="17" fill="#fef3c7"/>
    <text x="444" y="525" fill="#92400e">Pending</text>
    <rect x="420" y="578" width="128" height="34" rx="17" fill="#dcfce7"/>
    <text x="448" y="601" fill="#166534">Verified</text>
    <rect x="420" y="654" width="128" height="34" rx="17" fill="#dcfce7"/>
    <text x="448" y="677" fill="#166534">Verified</text>
    <rect x="676" y="426" width="150" height="34" rx="17" fill="#e0f2fe"/>
    <text x="708" y="449" fill="#075985">Trusted</text>
    <rect x="676" y="502" width="150" height="34" rx="17" fill="#f8fafc"/>
    <text x="714" y="525" fill="#475569">Normal</text>
    <rect x="676" y="578" width="150" height="34" rx="17" fill="#fee2e2"/>
    <text x="722" y="601" fill="#991b1b">Held</text>
    <rect x="676" y="654" width="150" height="34" rx="17" fill="#f8fafc"/>
    <text x="714" y="677" fill="#475569">Normal</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="20" fill="#334155">
    <text x="990" y="450">12 minutes ago</text>
    <text x="990" y="526">1 hour ago</text>
    <text x="990" y="602">Yesterday</text>
    <text x="990" y="678">3 days ago</text>
  </g>
</svg>
