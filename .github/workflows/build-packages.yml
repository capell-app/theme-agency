name: Build Packages

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        package: [layout-builder]
    env:
      ROLLUP_SKIP_NATIVE: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Build frontend when package defines npm scripts
        run: |
          PACKAGE_DIR="packages/${{ matrix.package }}"

          if [ ! -f "${PACKAGE_DIR}/package.json" ]; then
            echo "No package.json found for ${PACKAGE_DIR}; skipping frontend build."
            exit 0
          fi

          npm install --prefix "${PACKAGE_DIR}" --no-audit --no-fund
          npm run --prefix "${PACKAGE_DIR}" build
