name: Build Packages

permissions:
  contents: read

on:
  pull_request:
    branches:
      - 4.x
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/frontend-optimizer/**'
      - '.github/workflows/build-packages.yml'

jobs:
  build-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        package: [frontend-optimizer]
    env:
      ROLLUP_SKIP_NATIVE: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js 20.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20.x'

      - name: Build frontend when package defines npm scripts
        run: |
          PACKAGE_DIR="packages/${{ matrix.package }}"

          if [ ! -f "${PACKAGE_DIR}/package.json" ]; then
            echo "No package.json found for ${PACKAGE_DIR}; skipping frontend build."
            exit 0
          fi

          npm install --prefix "${PACKAGE_DIR}" --no-audit --no-fund
          npm run --prefix "${PACKAGE_DIR}" build
