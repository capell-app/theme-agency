name: monorepo-split

permissions:
  contents: read

on:
  push:
    tags: '*'

jobs:
  split-monorepo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_directory: packages/access-gate
            repository_name: access-gate
          - package_directory: packages/address
            repository_name: address
          - package_directory: packages/agent-bridge
            repository_name: agent-bridge
          - package_directory: packages/agent-delivery
            repository_name: agent-delivery
          - package_directory: packages/ai-orchestrator
            repository_name: ai-orchestrator
          - package_directory: packages/api
            repository_name: api
          - package_directory: packages/automation-studio
            repository_name: automation-studio
          - package_directory: packages/block-library
            repository_name: block-library
          - package_directory: packages/blog
            repository_name: blog
          - package_directory: packages/bookings
            repository_name: bookings
          - package_directory: packages/equestrian-clinics
            repository_name: equestrian-clinics
          - package_directory: packages/campaign-studio
            repository_name: campaign-studio
          - package_directory: packages/comments
            repository_name: comments
          - package_directory: packages/contacts
            repository_name: contacts
          - package_directory: packages/content-sections
            repository_name: content-sections
          - package_directory: packages/customer-portal
