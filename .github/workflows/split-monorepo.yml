          - package_directory: packages/shopify-commerce
            repository_name: shopify-commerce
          - package_directory: packages/site-discovery
            repository_name: site-discovery
          - package_directory: packages/site-monitor
            repository_name: site-monitor
          - package_directory: packages/social-feeds
            repository_name: social-feeds
          - package_directory: packages/structured-content-library
            repository_name: structured-content-library
          - package_directory: packages/tags
            repository_name: tags
          - package_directory: packages/theme-agency
            repository_name: theme-agency
          - package_directory: packages/theme-commerce
            repository_name: theme-commerce
          - package_directory: packages/theme-corporate
            repository_name: theme-corporate
          - package_directory: packages/theme-education
            repository_name: theme-education
          - package_directory: packages/theme-estate-agents
            repository_name: theme-estate-agents
