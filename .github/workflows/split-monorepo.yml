            repository_name: theme-healthcare
          - package_directory: packages/theme-inertia-bookings
            repository_name: theme-inertia-bookings
          - package_directory: packages/theme-inertia-bookings-react
            repository_name: theme-inertia-bookings-react
          - package_directory: packages/theme-inertia-bookings-vue
            repository_name: theme-inertia-bookings-vue
          - package_directory: packages/theme-knowledge
            repository_name: theme-knowledge
          - package_directory: packages/theme-liquid-glass
            repository_name: theme-liquid-glass
          - package_directory: packages/theme-local-services
            repository_name: theme-local-services
          - package_directory: packages/theme-nonprofit
            repository_name: theme-nonprofit
          - package_directory: packages/theme-portfolio
            repository_name: theme-portfolio
          - package_directory: packages/theme-restaurant
            repository_name: theme-restaurant
          - package_directory: packages/theme-saas
            repository_name: theme-saas
          - package_directory: packages/translation-manager
            repository_name: translation-manager
          - package_directory: packages/url-manager
            repository_name: url-manager
          - package_directory: packages/welcome-tour
            repository_name: welcome-tour
          - package_directory: packages/wordpress-importer
            repository_name: wordpress-importer
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: previous-tag
        uses: 'WyriHaximus/github-action-get-previous-tag@61819f33034117e6c686e6a31dba995a85afc9de' # master
      - name: Ensure split repository branch exists
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          REPOSITORY_NAME: ${{ matrix.repository_name }}
          SPLIT_BRANCH: 4.x
        run: |
          set -euo pipefail

          repository_url="https://x-access-token:${ACCESS_TOKEN}@github.com/capell-app/${REPOSITORY_NAME}.git"

          if git ls-remote --exit-code --heads "${repository_url}" "${SPLIT_BRANCH}" > /dev/null; then
            echo "Split repository branch ${SPLIT_BRANCH} already exists for ${REPOSITORY_NAME}."
            exit 0
          fi

          worktree="$(mktemp -d)"
          trap 'rm -rf "${worktree}"' EXIT

          if git clone --depth=1 "${repository_url}" "${worktree}"; then
            cd "${worktree}"
            default_branch="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p' || true)"

            if [ -n "${default_branch}" ] && git rev-parse --verify "origin/${default_branch}" > /dev/null 2>&1; then
              git checkout -B "${SPLIT_BRANCH}" "origin/${default_branch}"
              git push origin "HEAD:${SPLIT_BRANCH}"
              exit 0
            else
              git checkout --orphan "${SPLIT_BRANCH}"
            fi
          else
            git init "${worktree}"
            cd "${worktree}"
            git remote add origin "${repository_url}"
            git checkout --orphan "${SPLIT_BRANCH}"
          fi

          git config user.name 'capell-app'
          git config user.email 'appcapello@gmail.com'
          git commit --allow-empty -m "Initialize ${SPLIT_BRANCH} branch"
          git push origin "${SPLIT_BRANCH}"
      - name: Monorepo Split of ${{ matrix.repository_name }}
        uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893 # v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        with:
          package_directory: '${{ matrix.package_directory }}'
          repository_organization: 'capell-app'
          repository_name: '${{ matrix.repository_name }}'
          branch: '4.x'
          tag: ${{ steps.previous-tag.outputs.tag }}
          user_name: 'capell-app'
          user_email: 'appcapello@gmail.com'
