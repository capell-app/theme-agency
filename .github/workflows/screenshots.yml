name: Screenshot Manifests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - 4.x
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/**/docs/screenshots.json'
      - 'docs/package-screenshot-manifest.json'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

jobs:
  validate-screenshot-manifests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Use Node.js 20.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20.x'

      - name: Validate screenshot manifests
        run: node scripts/validate-screenshot-manifests.js
