name: Update Pest Shards

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 1'

concurrency:
  group: update-pest-shards
  cancel-in-progress: true

jobs:
  update-pest-shards:
    name: Update time-balanced Pest shards
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.ACCESS_TOKEN }}"} }'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout Capell monorepo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: capell-app/capell
          ref: 4.x
          token: ${{ secrets.ACCESS_TOKEN }}
          path: capell-4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: curl, dom, fileinfo, gd, intl, json, libxml, mbstring, pdo_sqlite, simplexml, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Check Composer public files
        run: php scripts/check-composer-local-paths.php

      - name: Check Composer lock file
        run: composer run check:composer-lock

      - name: Use Capell monorepo packages
        run: |
          php <<'PHP'
          <?php

          declare(strict_types=1);

          $composerFile = 'composer.json';
          $composer = json_decode((string) file_get_contents($composerFile), true, flags: JSON_THROW_ON_ERROR);

          array_unshift($composer['repositories'], [
              'type' => 'path',
              'url' => 'capell-4/packages/*',
              'options' => [
                  'symlink' => false,
              ],
          ]);

          file_put_contents(
              $composerFile,
              json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL,
          );
          PHP

      - name: Install PHP dependencies
        run: |
          composer remove --no-interaction --no-progress --ansi --dev --no-update laravel/pao
          composer require --no-interaction --no-progress --ansi --no-update \
            "laravel/framework:12.*"
          composer require --no-interaction --no-progress --ansi --dev --no-update \
            "orchestra/testbench:10.*"
          composer require --no-interaction --no-progress --ansi --no-update \
            "livewire/livewire:^4.0"
          composer require --no-interaction --no-progress --ansi --no-update \
            filament/filament:^4.7 \
            filament/support:^4.7 \
            pboivin/filament-peek:^3.0 \
            symfony/html-sanitizer:^7.0 \
            openspout/openspout:^4.22
          composer update --no-interaction --no-progress --ansi --optimize-autoloader --with-all-dependencies -W

      - name: Configure environment
        run: |
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env

      - name: Update Pest shard timings
        run: composer run test:shards

      - name: Open shard timing pull request
        run: |
          untracked_shards="$(git ls-files --others --exclude-standard tests/.pest/shards.json)"

          if git diff --quiet -- tests/.pest/shards.json && [ -z "${untracked_shards}" ]; then
            echo "Pest shard timings are already current."
            exit 0
          fi

          branch="chore/update-pest-shards-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add tests/.pest/shards.json
          git commit -m "chore: update Pest shard timings"
          git push --set-upstream origin "${branch}"
          gh pr create \
            --base 4.x \
            --head "${branch}" \
            --title "Update Pest shard timings" \
            --body "Refreshes tests/.pest/shards.json for Pest time-balanced sharding."
