name: Asset Formatting

on:
  pull_request:
    branches:
      - 4.x
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/**/*.js'
      - 'packages/**/*.css'
      - 'packages/**/*.yml'
      - 'packages/**/*.blade.php'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/asset-formatting.yml'

permissions:
  contents: read

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '18.18.0'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npx prettier --check 'packages/**/*.{css,js,yml,blade.php}' '!packages/**/node_modules/**'
