name: Asset Formatting

on:
  pull_request:
    branches:
      - 4.x
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/**/*.js'
      - 'packages/**/*.css'
      - 'packages/**/*.yml'
      - 'packages/**/*.blade.php'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/asset-formatting.yml'

permissions:
  contents: read

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '18.18.0'
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          tools: pint

      - name: Install npm dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npx prettier --check 'packages/**/*.{css,js,yml,blade.php}' '!packages/**/node_modules/**' '!packages/foundation-theme/resources/views/components/widget/modern/pricing-table.blade.php'
