name: Tests (full suite)

permissions:
  contents: read

on:
  push:
    branches:
      - 4.x

concurrency:
  group: ${{ github.ref }}-phpunit-full
  cancel-in-progress: true

jobs:
  test-full:
    name: Tests - P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - DB${{ matrix.db }}
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.ACCESS_TOKEN }}"} }'
    strategy:
      fail-fast: true
      matrix:
        include:
          - php: 8.4
            laravel: 11.*
            testbench: 9.*
            livewire: ^3.7
            stability: prefer-stable
            db: sqlite
            mysql_port: 3308
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            livewire: ^4.0
            stability: prefer-stable
            db: mysql
            mysql_port: 3307

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_cms_multi
        ports:
          - '${{ matrix.mysql_port }}:3306'
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout Capell monorepo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: capell-app/capell
          ref: 4.x
          token: ${{ secrets.ACCESS_TOKEN }}
          path: capell-4

      - name: Cache Dependencies PHP
        id: php-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: dependencies-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-testbench-${{ matrix.testbench }}-livewire-${{ matrix.livewire }}-${{ matrix.db }}-${{ hashFiles('composer.json', 'composer.lock', '.github/workflows/test-full.yml') }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, intl, json, libxml, mbstring, pcov, pdo_mysql, pdo_sqlite, simplexml, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Check Composer public files
        run: php scripts/check-composer-local-paths.php

      - name: Check Composer lock file
        run: composer run check:composer-lock

      - name: Use Capell monorepo packages
        run: |
          php <<'PHP'
          <?php

          declare(strict_types=1);

          $composerFile = 'composer.json';
          $composer = json_decode((string) file_get_contents($composerFile), true, flags: JSON_THROW_ON_ERROR);

          array_unshift($composer['repositories'], [
              'type' => 'path',
              'url' => 'capell-4/packages/*',
              'options' => [
                  'symlink' => false,
              ],
          ]);

          file_put_contents(
              $composerFile,
              json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL,
          );
          PHP

      - name: Install PHP dependencies
        run: |
          composer remove --no-interaction --no-progress --ansi --dev --no-update laravel/pao
          composer require --no-interaction --no-progress --ansi --no-update \
            "laravel/framework:${{ matrix.laravel }}"
          composer require --no-interaction --no-progress --ansi --dev --no-update \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer require --no-interaction --no-progress --ansi --no-update \
            "livewire/livewire:${{ matrix.livewire }}"

          # Laravel 11 uses the Pest 3 stack; Pest 4 workers crash under this matrix.
          if [ "${{ matrix.laravel }}" = "11.*" ]; then
            composer remove --no-interaction --no-progress --ansi --dev --no-update mrpunyapal/peststan pestphp/pest-plugin-livewire calebdw/larastan-livewire
            composer require --no-interaction --no-progress --ansi --dev --no-update \
              soyhuce/phpstan-extension:^1.1 \
              pestphp/pest:^3.0 \
              pestphp/pest-plugin-arch:^3.0 \
              pestphp/pest-plugin-laravel:^3.0 \
              pestphp/pest-plugin-livewire:^3.0 \
              pestphp/pest-plugin-type-coverage:^3.0 \
              phpstan/phpstan:^1.10.57 \
              phpstan/phpstan-mockery:^1.0 \
              phpstan/phpstan-strict-rules:^1.0 \
              canvural/larastan-strict-rules:^2.0 \
              phpstan/phpstan-beberlei-assert:^1.0 \
              rector/rector:^1.0 \
              driftingly/rector-laravel:^1.0 \
              larastan/larastan:^2.0
            composer require --no-interaction --no-progress --ansi --no-update \
              filament/filament:^4.7 \
              filament/support:^4.7 \
              pboivin/filament-peek:^3.0 \
              symfony/html-sanitizer:^7.0 \
              openspout/openspout:^4.22
          fi
          composer update --no-interaction --no-progress --ansi --optimize-autoloader --with-all-dependencies -W

      - name: Configure environment
        run: |
          if [ "${{ matrix.db }}" == "mysql" ]; then
            echo "DB_CONNECTION=mysql" >> .env
            echo "DB_HOST=127.0.0.1" >> .env
            echo "DB_PORT=${{ matrix.mysql_port }}" >> .env
            echo "DB_DATABASE=test_cms_multi" >> .env
            echo "DB_USERNAME=root" >> .env
            echo "DB_PASSWORD=root" >> .env
          else
            echo "DB_CONNECTION=sqlite" >> .env
            echo "DB_DATABASE=:memory:" >> .env
          fi

      - name: Execute full test suite
        id: full-suite
        continue-on-error: true
        shell: bash
        env:
          NO_COLOR: '1'
        run: |
          set +e
          composer run test:all:ci 2>&1 | tee full-test-output.txt
          test_exit_code=${PIPESTATUS[0]}
          echo "exit_code=${test_exit_code}" >> "$GITHUB_OUTPUT"
          exit "${test_exit_code}"

      - name: Parse engineering metrics
        id: engineering-metrics
        if: ${{ steps.full-suite.outputs.exit_code == '0' && matrix.php == '8.4' && matrix.laravel == '12.*' && matrix.stability == 'prefer-stable' && matrix.db == 'mysql' }}
        run: |
          php <<'PHP'
          <?php

          declare(strict_types=1);

          $output = file_get_contents('full-test-output.txt');

          if ($output === false) {
              throw new RuntimeException('Unable to read full-test-output.txt.');
          }

          $plainOutput = preg_replace('/\x1B(?:[@-Z\\\\-_]|\[[0-?]*[ -\/]*[@-~])/', '', $output);

          if ($plainOutput === null) {
              throw new RuntimeException('Unable to normalize Pest output.');
          }

          $patterns = [
              '/Tests:\s*([0-9][0-9,]*)\s*,\s*Assertions:\s*([0-9][0-9,]*)/i',
              '/Tests:\s*([0-9][0-9,]*)\s*passed\s*\(\s*([0-9][0-9,]*)\s+assertions?\s*\)/i',
          ];

          $tests = null;
          $assertions = null;

          foreach ($patterns as $pattern) {
              if (preg_match_all($pattern, $plainOutput, $matches, PREG_SET_ORDER) === 0) {
                  continue;
              }

              $lastMatch = $matches[count($matches) - 1];

              $tests = (int) str_replace(',', '', $lastMatch[1]);
              $assertions = (int) str_replace(',', '', $lastMatch[2]);

              break;
          }

          if ($tests === null || $assertions === null) {
              throw new RuntimeException('Unable to parse final test and assertion counts from Pest output.');
          }

          file_put_contents(
              getenv('GITHUB_OUTPUT'),
              sprintf("tests=%d\nassertions=%d\n", $tests, $assertions),
              FILE_APPEND,
          );

          fwrite(STDOUT, sprintf("Parsed engineering metrics: %d tests, %d assertions.\n", $tests, $assertions));
          PHP

      - name: Send engineering metrics dispatch
        if: ${{ steps.engineering-metrics.outcome == 'success' }}
        env:
          ENGINEERING_METRICS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          script: |
            if (!process.env.ENGINEERING_METRICS_TOKEN) {
              core.setFailed('Missing ACCESS_TOKEN secret.');
              return;
            }

            const client_payload = {
              source: 'capell-packages',
              tests: Number('${{ steps.engineering-metrics.outputs.tests }}'),
              assertions: Number('${{ steps.engineering-metrics.outputs.assertions }}'),
              run_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              sha: context.sha,
              phpstan_level: 6,
            };

            await github.rest.repos.createDispatchEvent({
              owner: 'capell-app',
              repo: 'capell-app',
              event_type: 'engineering-metrics',
              client_payload,
            });
            core.info(`Dispatched engineering-metrics payload: ${JSON.stringify(client_payload)}`);

      - name: Fail job if full suite failed
        if: ${{ steps.full-suite.outputs.exit_code != '0' }}
        run: exit 1
