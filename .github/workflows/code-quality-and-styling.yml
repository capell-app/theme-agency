name: PHP Quality

on:
  pull_request:
    branches:
      - 4.x
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/**/*.php'
      - 'packages/**/capell.json'
      - 'packages/**/docs/screenshots.json'
      - 'tests/**/*.php'
      - 'docs/package-screenshot-manifest.json'
      - 'docs/package-security-surface.md'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'rector.php'
      - 'scripts/rector-changed.sh'
      - 'scripts/check-phpstan-baseline-growth.sh'
      - 'scripts/audit-package-security.php'
      - 'scripts/generate-package-security-surface-report.php'
      - 'scripts/audit-manifest-v3.php'
      - 'scripts/scan-secrets.php'
      - 'scripts/sync-package-security-manifests.php'
      - 'scripts/validate-screenshot-manifests.js'
      - 'scripts/php-modernization-skill.sh'
      - 'phpstan/**'
      - 'phpstan*.neon'
      - 'phpunit.xml'
      - 'pint.json'
      - '.php-cs-fixer.dist.php'
      - '.github/workflows/code-quality-and-styling.yml'

permissions:
  contents: read

jobs:
  quality:
    name: PHP Quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.4]
    env:
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.ACCESS_TOKEN }}"} }'
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Checkout Capell monorepo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: capell-app/capell
          ref: 4.x
          token: ${{ secrets.ACCESS_TOKEN }}
          path: capell-4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, intl, json, libxml, mbstring, phar, simplexml, zip
          tools: composer:v2, pint
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=256M, memory_limit=-1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check Composer public files
        run: php scripts/check-composer-local-paths.php

      - name: Check Composer lock file
        run: composer run check:composer-lock

      - name: Use Capell monorepo packages
        run: |
          php <<'PHP'
          <?php

          declare(strict_types=1);

          $composerFile = 'composer.json';
          $composer = json_decode((string) file_get_contents($composerFile), true, flags: JSON_THROW_ON_ERROR);

          array_unshift($composer['repositories'], [
              'type' => 'path',
              'url' => 'capell-4/packages/*',
              'options' => [
                  'symlink' => false,
              ],
          ]);

          file_put_contents(
              $composerFile,
              json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL,
          );
          PHP

      - name: Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}

      - name: Install Composer dependencies
        run: |
          composer update --no-interaction --no-progress --ansi --optimize-autoloader --with-all-dependencies -W \
            capell-app/admin \
            capell-app/core \
            capell-app/frontend \
            capell-app/installer \
            capell-app/marketplace

      - name: Run Pint check
        run: composer cs:check

      - name: Validate package manifests
        run: composer manifest:check

      - name: Validate screenshot manifests
        run: npm run screenshots:check

      - name: Check capell.json formatting
        run: npm run capell-json:check

      - name: Cache PHPStan result cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /tmp/phpstan/capell-packages
          key: phpstan-${{ runner.os }}-php${{ matrix.php }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ runner.os }}-php${{ matrix.php }}-

      - name: Run PHPStan
        run: composer phpstan

      - name: Run PHPStan deprecation rules
        continue-on-error: true
        run: composer phpstan:deprecations

      - name: Check PHPStan baseline did not grow
        run: composer phpstan:baseline-check

      - name: Run package security contracts
        run: composer security:contracts

      - name: Run Composer audit
        run: composer audit --locked

      - name: Run Rector dry-run
        run: composer rector:check

      - name: Run modernization verifier advisory
        continue-on-error: true
        run: composer skill:verify

      - name: Upload modernization artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: php-modernization-${{ github.run_id }}
          path: .build/php-modernization/
          if-no-files-found: ignore
