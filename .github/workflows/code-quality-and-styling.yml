name: Code Quality & Styling

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Styling
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.4]
    env:
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.ACCESS_TOKEN }}"} }'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout Capell monorepo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: capell-app/capell
          ref: 4.x
          token: ${{ secrets.ACCESS_TOKEN }}
          path: capell-4

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '18.18.0'

      - name: Cache npm dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: npm install

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, intl, json, libxml, mbstring, simplexml, zip
          tools: composer:v2, pint

      - name: Check Composer public files
        run: php scripts/check-composer-local-paths.php

      - name: Check Composer lock file
        run: composer run check:composer-lock

      - name: Use Capell monorepo packages
        run: |
          php <<'PHP'
          <?php

          declare(strict_types=1);

          $composerFile = 'composer.json';
          $composer = json_decode((string) file_get_contents($composerFile), true, flags: JSON_THROW_ON_ERROR);

          array_unshift($composer['repositories'], [
              'type' => 'path',
              'url' => 'capell-4/packages/*',
              'options' => [
                  'symlink' => false,
              ],
          ]);

          file_put_contents(
              $composerFile,
              json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL,
          );
          PHP

      - name: Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}

      - name: Install Composer dependencies
        run: |
          composer update --no-interaction --no-progress --ansi --optimize-autoloader --with-all-dependencies -W \
            capell-app/admin \
            capell-app/core \
            capell-app/frontend \
            capell-app/installer \
            capell-app/marketplace

      - name: Run Prettier
        run: npx prettier --write 'packages/**/*.{css,js,yml,blade.php}' '!packages/**/node_modules/**'

      - name: Run Pint (Code Style)
        run: composer lint

      - name: Run PHPStan (Static Analysis)
        run: composer analyze

      - name: Run Rector (Code Refactoring)
        run: composer rector
