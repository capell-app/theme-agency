name: Tests (fast PR)

permissions:
  contents: read

on:
  pull_request:
    branches:
      - 4.x
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/**/*.php'
      - 'tests/**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/test-fast-pr.yml'
      - '.github/workflows/test-full.yml'
      - 'phpunit.xml'

concurrency:
  group: ${{ github.head_ref || github.ref }}-phpunit-fast-pr
  cancel-in-progress: true

jobs:
  test-fast:
    if: github.event.pull_request.draft == false
    name: Tests (fast PR suite)
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.ACCESS_TOKEN }}"} }'
    strategy:
      fail-fast: true
      matrix:
        include:
          - php: 8.3
            laravel: 11.*
            testbench: 9.*
            livewire: ^3.7
            db: sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout Capell monorepo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: capell-app/capell
          ref: 4.x
          token: ${{ secrets.ACCESS_TOKEN }}
          path: capell-4

      - name: Cache Dependencies PHP
        id: php-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: vendor
          key: dependencies-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-testbench-${{ matrix.testbench }}-livewire-${{ matrix.livewire }}-${{ matrix.db }}-${{ hashFiles('composer.json', 'composer.lock', '.github/workflows/test-fast-pr.yml') }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, intl, json, libxml, mbstring, pdo_sqlite, simplexml, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Check Composer public files
        run: php scripts/check-composer-local-paths.php

      - name: Check Composer lock file
        run: composer run check:composer-lock

      - name: Use Capell monorepo packages
        run: |
          php <<'PHP'
          <?php

          declare(strict_types=1);

          $composerFile = 'composer.json';
          $composer = json_decode((string) file_get_contents($composerFile), true, flags: JSON_THROW_ON_ERROR);

          array_unshift($composer['repositories'], [
              'type' => 'path',
              'url' => 'capell-4/packages/*',
              'options' => [
                  'symlink' => false,
              ],
          ]);

          file_put_contents(
              $composerFile,
              json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL,
          );
          PHP

      - name: Install PHP dependencies
        run: |
          composer remove --no-interaction --no-progress --ansi --dev --no-update laravel/pao
          composer require --no-interaction --no-progress --ansi --no-update \
            "laravel/framework:${{ matrix.laravel }}"
          composer require --no-interaction --no-progress --ansi --dev --no-update \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer require --no-interaction --no-progress --ansi --no-update \
            "livewire/livewire:${{ matrix.livewire }}"

          composer remove --no-interaction --no-progress --ansi --dev --no-update mrpunyapal/peststan pestphp/pest-plugin-livewire calebdw/larastan-livewire
          composer require --no-interaction --no-progress --ansi --dev --no-update \
            soyhuce/phpstan-extension:^1.1 \
            pestphp/pest:^3.0 \
            pestphp/pest-plugin-arch:^3.0 \
            pestphp/pest-plugin-laravel:^3.0 \
            pestphp/pest-plugin-livewire:^3.0 \
            pestphp/pest-plugin-type-coverage:^3.0 \
            phpstan/phpstan:^1.10.57 \
            phpstan/phpstan-mockery:^1.0 \
            phpstan/phpstan-strict-rules:^1.0 \
            canvural/larastan-strict-rules:^2.0 \
            phpstan/phpstan-beberlei-assert:^1.0 \
            rector/rector:^1.0 \
            driftingly/rector-laravel:^1.0 \
            larastan/larastan:^2.0
          composer require --no-interaction --no-progress --ansi --no-update \
            filament/filament:^4.7 \
            filament/support:^4.7 \
            pboivin/filament-peek:^3.0 \
            symfony/html-sanitizer:^7.0 \
            openspout/openspout:^4.22
          composer update --no-interaction --no-progress --ansi --optimize-autoloader --with-all-dependencies -W

      - name: Configure environment
        run: |
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env

      - name: Execute fast PR tests
        run: composer run test:all:ci
